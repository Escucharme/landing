<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My landing page</title>
  <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon">
  <!-- We need this line below for responsiveness! -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="banner" style="background-image: url(images/Banner.jpg);">
    <div class="banner-container">
      <h2>MusicBook</h2>
      <p>Share, listen and discover music with your friends!</p>
      <a class="btn" href="#">Join Now</a>
    </div>
  </div>
  <br>
  <div class="cards">
    <div class="card">
      <img src="images/music listen.png" alt>
      <h4>Listen</h4>
      <p>Listen to music, with your friends from everywhere.</p>
    </div>
    <div class="card">
      <img src="images/music discover.png" alt>
      <h4>Discover</h4>
      <p>Discover music, with your friends from everywhere.</p>
    </div>
    <div class="card">
      <img src="images/Music share.png" alt>
      <h4>Share</h4>
      <p>Share music, with your friends from everywhere.</p>
    </div>
  </div>
  <br>
  <div class="footer">
    <div class="links">
      <a href="#">
        <i class="fab fa-fw fa-facebook-f"></i>
      </a>
      <a href="#">
        <i class="fab fa-fw fa-github"></i>
      </a>
      <a href="#">
        <i class="fab fa-fw fa-twitter"></i>
      </a>
      <a href="#">
        <i class="fab fa-fw fa-instagram"></i>
      </a>
      <p>This website was coded by Escucharme with
        <i class="fas fa-heart"></i>
      </p>
    </div>
  </div>

</body>
</html>
